[versions]
junit = "4.13.2"
kotlin = "2.4.10"
detekt = "1.23.8"
kotlinx-serialization = "1.11.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
jetbrains-annotations = "org.jetbrains:annotations:26.1.0"
detekt-libraries = { module = "io.gitlab.arturbosch.detekt:detekt-rules-libraries", version.ref = "detekt" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-io = "org.jetbrains.kotlinx:kotlinx-io-core:0.9.1"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
dokka = "org.jetbrains.dokka:2.2.0"
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
changelog = "org.jetbrains.changelog:2.5.0"
tapmoc = "com.gradleup.tapmoc:0.4.2"
kotlinx-kover = "org.jetbrains.kotlinx.kover:0.9.9"
vanniktech-maven-publish = "com.vanniktech.maven.publish:0.37.0"
cashapp-burst = "app.cash.burst:2.13.0"
